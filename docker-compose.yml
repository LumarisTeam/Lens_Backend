services:
  postgres:
    image: postgres:16-alpine
    container_name: bug-feedback-postgres
    environment:
      POSTGRES_USER: bug
      POSTGRES_PASSWORD: bug
      POSTGRES_DB: bug_feedback
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bug -d bug_feedback"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
