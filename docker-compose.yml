# 生产部署编排（本机未装 Docker，未实测；dependencies 按官方文档写法）
#
# 用法说明：
#   - 当前 Password.env 的 DB_DSN 指向远程库（43.128.23.102:25432），
#     此时只需后端容器：docker compose up -d backend
#   - 若要连 compose 内的 PostgreSQL，把 DB_DSN 的主机改为 postgres:5432，
#     再 docker compose up -d 启动整套。
#   - 也可不用 compose：docker run --env-file Password.env ...（见 DEPLOY.md）

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bug}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置}
      POSTGRES_DB: ${POSTGRES_DB:-bug_feedback}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bug} -d ${POSTGRES_DB:-bug_feedback}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: .                # 或用 image: 你的镜像仓库地址
    env_file:
      - Password.env       # 真实密钥文件，已被 .gitignore 保护，不入库
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
